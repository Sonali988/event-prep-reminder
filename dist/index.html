<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Prep Reminder</title>
    <script type="module" crossorigin src="/assets/index-BAwTCkvU.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CluTddXG.css">
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="header__titles">
          <h1 class="header__title">Event Prep Reminder</h1>
          <p class="header__subtitle">Stay on track before the service starts</p>
        </div>
        <div class="header__clock" aria-live="polite">
          <span class="header__clock-label">Now</span>
          <time id="live-clock" class="header__clock-time">--:--:--</time>
        </div>
      </header>

      <section class="status-strip" id="status-strip" aria-live="polite">
        Loading…
      </section>

      <details class="settings" id="settings-panel">
        <summary class="settings__summary">Settings</summary>
        <div class="settings__body">
          <label class="settings__field">
            <span>Event end time</span>
            <input type="time" id="end-time-input" value="09:45" />
          </label>

          <fieldset class="settings__field">
            <legend>Reminder interval</legend>
            <div class="settings__radio-group">
              <label>
                <input type="radio" name="interval" value="15" checked />
                15 min
              </label>
              <label>
                <input type="radio" name="interval" value="20" />
                20 min
              </label>
            </div>
          </fieldset>

          <button type="button" class="btn btn--secondary" id="reset-checklist-btn">
            Reset checklist
          </button>
        </div>
      </details>

      <main class="checklist" id="checklist" aria-label="Preparation checklist"></main>
    </div>

    <div class="modal-backdrop hidden" id="reminder-modal" role="dialog" aria-modal="true" aria-labelledby="reminder-title">
      <div class="modal">
        <h2 class="modal__title" id="reminder-title">Reminder — still pending</h2>
        <p class="modal__intro">Please confirm these items before the service starts:</p>
        <ul class="modal__list" id="reminder-list"></ul>
        <div class="modal__actions">
          <button type="button" class="btn btn--primary" id="reminder-dismiss-btn">Got it</button>
        </div>
      </div>
    </div>

    <div class="final-alert hidden" id="final-alert" role="alert">
      <div class="final-alert__content">
        <strong>Be ready — the service is getting started.</strong>
        <p>Remove the lyrics from the screen.</p>
        <button type="button" class="btn btn--primary" id="final-alert-dismiss-btn">Dismiss</button>
      </div>
    </div>

  </body>
</html>
