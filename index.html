<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/fav.png" type="image/png" />
    <title>Live System Checklist</title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="header__top">
          <div class="header__titles">
            <h1 class="header__title">Live System Checklist</h1>
            <p class="header__subtitle">Preparation checklist for service day</p>
          </div>
          <div class="header__meta" aria-live="polite">
            <time id="live-clock" class="header__clock-time">--:--:--</time>
            <div class="header__utilities">
              <span class="sync-status sync-status--loading" id="sync-status" title="Shared sync status">Loading…</span>
              <div class="actions-menu" id="actions-menu">
                <button
                  type="button"
                  class="actions-menu__trigger"
                  id="actions-menu-btn"
                  aria-label="More actions"
                  aria-haspopup="menu"
                  aria-expanded="false"
                  aria-controls="actions-menu-popover"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <circle cx="12" cy="5" r="2" />
                    <circle cx="12" cy="12" r="2" />
                    <circle cx="12" cy="19" r="2" />
                  </svg>
                </button>
                <div class="actions-menu__popover hidden" id="actions-menu-popover" role="menu" aria-label="Checklist actions">
                  <button type="button" class="actions-menu__item" role="menuitem" id="export-checklist-pdf-btn">
                    Download checklist PDF
                  </button>
                  <button type="button" class="actions-menu__item actions-menu__item--danger" role="menuitem" id="reset-checklist-btn">
                    Reset checklist
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="header__progress" id="header-progress">
          <div class="progress-bar" aria-hidden="true">
            <div class="progress-bar__fill" id="progress-bar-fill" style="width: 0%"></div>
          </div>
          <p class="header__progress-text" id="status-strip">Loading…</p>
        </div>
      </header>

      <nav class="app-nav" role="tablist" aria-label="Sections">
        <button
          type="button"
          class="app-nav__tab app-nav__tab--active"
          role="tab"
          id="tab-checklist"
          aria-selected="true"
          aria-controls="panel-checklist"
          data-panel="checklist"
        >
          Checklist
          <span class="app-nav__badge" id="checklist-tab-badge" hidden></span>
        </button>
        <button
          type="button"
          class="app-nav__tab"
          role="tab"
          id="tab-timers"
          aria-selected="false"
          aria-controls="panel-timers"
          data-panel="timers"
        >
          Timers
        </button>
        <button
          type="button"
          class="app-nav__tab"
          role="tab"
          id="tab-notes"
          aria-selected="false"
          aria-controls="panel-notes"
          data-panel="notes"
        >
          Notes
          <span class="app-nav__badge app-nav__badge--dot" id="notes-tab-badge" hidden aria-label="Notes added"></span>
        </button>
      </nav>

      <div class="app-panels">
        <section
          class="app-panel app-panel--active"
          id="panel-checklist"
          role="tabpanel"
          aria-labelledby="tab-checklist"
          tabindex="0"
        >
          <main class="checklist" id="checklist" aria-label="Preparation checklist"></main>
        </section>

        <section
          class="app-panel"
          id="panel-timers"
          role="tabpanel"
          aria-labelledby="tab-timers"
          tabindex="0"
          hidden
        >
          <section class="testimony-timers" id="testimony-timers" aria-label="Testimony timers"></section>
        </section>

        <section
          class="app-panel"
          id="panel-notes"
          role="tabpanel"
          aria-labelledby="tab-notes"
          tabindex="0"
          hidden
        >
          <div class="service-notes" id="service-notes-panel">
            <div class="service-notes__header">
              <h2 class="service-notes__title">Service notes</h2>
              <p class="service-notes__intro">
                Capture remarks, observations, and challenges to discuss with the team later.
              </p>
            </div>

            <div class="service-notes__grid">
              <label class="service-notes__field">
                <span class="service-notes__label">Remarks</span>
                <span class="service-notes__hint">General comments or follow-ups from the service.</span>
                <textarea
                  id="service-remarks-input"
                  rows="5"
                  placeholder="e.g. Intro video started late, offering flow was smooth…"
                ></textarea>
              </label>

              <label class="service-notes__field">
                <span class="service-notes__label">Observations</span>
                <span class="service-notes__hint">Things you noticed during prep or the service.</span>
                <textarea
                  id="service-observations-input"
                  rows="5"
                  placeholder="e.g. Lyrics timing was off on song 3, backstage comms were clear…"
                ></textarea>
              </label>

              <label class="service-notes__field">
                <span class="service-notes__label">Challenges</span>
                <span class="service-notes__hint">Issues to address in the next team discussion.</span>
                <textarea
                  id="service-challenges-input"
                  rows="5"
                  placeholder="e.g. ProPresenter height needs preset, backup mic check missing…"
                ></textarea>
              </label>
            </div>

            <div class="service-notes__actions">
              <button type="button" class="btn btn--primary" id="copy-service-notes-btn">Copy notes</button>
              <button type="button" class="btn btn--ghost-danger" id="clear-service-notes-btn">Clear notes</button>
              <p class="service-notes__status hidden" id="service-notes-status" role="status"></p>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
